[package]
name = "inteagle-sign"
version = "0.1.0"
edition = "2021"
description = "Generate Inteagle Cloud MQTT / HTTP authentication credentials (HMAC-SHA256)"
license = "Apache-2.0"

[[bin]]
name = "inteagle-sign"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"